<!doctype html><html lang="es"><head><script>if(location.hostname.endsWith("github.io"))location.replace("https://guias.sergiosuarezmp.com"+location.pathname.replace(/^\/recursos/,"")+location.search)</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>IAs del Club · Sergio Suárez</title><link rel="stylesheet" href="../estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.cab{background:var(--am);color:#fff;padding:14px max(16px,env(safe-area-inset-left)) 14px;display:flex;align-items:center;gap:12px}
.cab .rec{display:inline-flex;gap:6px;align-items:center;background:rgba(0,0,0,.35);font:700 10px "Arial Black",Arial;letter-spacing:.08em;padding:5px 9px;border-radius:999px}
.cab .rec i{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:parp 1.2s infinite}@keyframes parp{50%{opacity:.2}}
.cab b{font:900 16px "Arial Black",Arial}.cab small{display:block;color:var(--lz);font-size:12px}.cab .sal{margin-left:auto;color:var(--lz);font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:0}
.caja{width:100%;max-width:760px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left)) 22px}
.tarjeta{background:#fff;border-radius:22px;padding:24px 20px;box-shadow:0 12px 26px rgba(44,47,20,.1)}
h1{font-family:"Arial Black",Arial;font-size:30px;line-height:1.05;margin:4px 0 8px}h1 span{font-family:Georgia,serif;font-style:italic;color:var(--am)}
.s{color:var(--su);margin:0 0 14px}
input,textarea{width:100%;padding:14px;border:2px solid #E3E5D2;border-radius:12px;font:16px Arimo,Helvetica,Arial,sans-serif;background:var(--cr)}
input:focus,textarea:focus{outline:0;border-color:var(--am)}
.btn{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:var(--am);color:#fff;font:900 16px "Arial Black",Arial;cursor:pointer;box-shadow:0 5px 0 var(--tx)}
.btn:disabled{opacity:.5}
.err{color:#9b3b2a;font-weight:700;margin:10px 0 0;min-height:1em}
.ias{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media(max-width:600px){.ias{grid-template-columns:1fr}}
.ia{text-align:left;background:#fff;border:2px solid #E3E5D2;border-radius:18px;padding:18px;cursor:pointer;transition:transform .2s,border-color .2s}
.ia:hover{transform:translateY(-3px) rotate(-.5deg);border-color:var(--am)}
.ia.bloq{opacity:.55;cursor:default}.ia.bloq:hover{transform:none;border-color:#E3E5D2}.ia .cand{margin-top:8px;font-weight:700;color:var(--am)}
.ia .ico{font-size:34px}.ia b{display:block;font:900 18px "Arial Black",Arial;margin:8px 0 4px}.ia p{margin:0;color:var(--su);font-size:14px}
.chat{flex:1;display:flex;flex-direction:column}
#msgs{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.m{max-width:92%;padding:13px 15px;border-radius:16px;line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--am);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.m.ia2{align-self:flex-start;background:#fff;border-bottom-left-radius:4px;box-shadow:0 6px 16px rgba(44,47,20,.08)}
.m.ia2 table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13.5px}.m.ia2 td,.m.ia2 th{border:1px solid #E3E5D2;padding:6px 8px;vertical-align:top}
.m.ia2 h1,.m.ia2 h2,.m.ia2 h3{font-size:16px;margin:12px 0 6px}.m.ia2 p{margin:6px 0}
.escribe{position:sticky;bottom:0;background:var(--cr);padding:10px 0 max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
.escribe textarea{min-height:52px;max-height:180px;resize:none}
.escribe button{flex:none;width:52px;height:52px;border:0;border-radius:14px;background:var(--am);color:#fff;font-size:20px;cursor:pointer}
.pensando{align-self:flex-start;color:var(--am);font-family:Georgia,serif;font-style:italic}
.quedan{font-size:12px;color:var(--su);text-align:center;margin-top:4px}
.oculto{display:none!important}
</style></head><body>
<div class="cab"><span class="rec"><i></i>CLUB</span><div><b id="titulo">IAs del Club Desde Cero</b><small id="sub">Sergio Suárez</small></div><button class="sal oculto" id="volver">← Cambiar de IA</button></div>

<!-- 1 · Código -->
<div class="caja" id="pCodigo"><div class="tarjeta">
<h1>Tus <span>IAs virales</span></h1>
<p class="s">Exclusivas para los miembros del Club. Escribe tu código personal (te lo da Sergio en el Club).</p>
<input id="codigo" placeholder="Ej.: CLUB-MARIA-7K2" autocomplete="off" autocapitalize="characters">
<button class="btn" id="entrar">Entrar</button><p class="err" id="errC"></p>
<p class="s" style="font-size:12.5px;margin-top:14px">Tu código es personal: no lo compartas. Si alguien lo usa, se te acaban tus mensajes del día.</p>
</div></div>

<!-- 2 · Elegir IA -->
<div class="caja oculto" id="pElegir">
<h1 id="hola">Hola 👋</h1><p class="s">¿Con qué IA quieres trabajar hoy?</p>
<div class="ias">
<button class="ia" data-ia="virales"><div class="ico">🎬</div><b>IA de Guiones Virales</b><p>Te pregunta por tu negocio y te da ideas y el guion completo de un vídeo viral: gancho, plano a plano, cómo grabarlo y editarlo.</p><p class="cand oculto">🔒 Se desbloquea en el nivel 3 del Club</p></button>
<button class="ia" data-ia="hooks"><div class="ico">🎯</div><b>IA de Hooks Virales</b><p>Ganchos que paran el dedo para tus vídeos, sacados de virales reales.</p><p class="cand oculto">🔒 Se desbloquea en el nivel 3 del Club</p></button>
</div><p class="quedan" id="quedan0"></p></div>

<!-- 3 · Chat -->
<div class="caja chat oculto" id="pChat">
<div id="msgs"></div>
<div class="escribe"><textarea id="txt" placeholder="Escribe aquí…" rows="1"></textarea><button id="enviar" aria-label="Enviar">➤</button></div>
<p class="quedan" id="quedan"></p>
</div>

<script>
const API=location.hostname.includes("sergiosuarezmp.com")?"/api/ia/":"https://guias.sergiosuarezmp.com/api/ia/";
const $=id=>document.getElementById(id);let codigo="",ia="",hist=[];
const NOMBRES={virales:["🎬 IA de Guiones Virales","Solo vídeos virales"],hooks:["🎯 IA de Hooks Virales","Ganchos que paran el dedo"]};
const guarda=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},lee=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function ver(p){["pCodigo","pElegir","pChat"].forEach(x=>$(x).classList.toggle("oculto",x!==p));$("volver").classList.toggle("oculto",p!=="pChat")}
async function llama(ruta,datos,n=0){const r=await fetch(API+ruta,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({codigo,...datos})});const j=await r.json().catch(()=>({error:"Error de conexión"}));if(r.status===503&&n<2){const p=document.querySelector(".pensando");if(p)p.textContent="Hay mucha gente usando la IA, sigo intentándolo…";await new Promise(ok=>setTimeout(ok,15000));return llama(ruta,datos,n+1)}if(!r.ok)throw new Error(j.error||"Error");return j}
async function entrar(c){codigo=c.trim().toUpperCase();$("errC").textContent="";$("entrar").disabled=true;
 try{const j=await llama("entrar",{});guarda("ia-codigo",codigo);$("hola").textContent="Hola"+(j.nombre?", "+j.nombre:"")+" 👋";$("quedan0").textContent=`Hoy te quedan ${j.quedan} mensajes.`;document.querySelectorAll(".ia").forEach(b=>{const ok=(j.ias||[]).includes(b.dataset.ia);b.classList.toggle("bloq",!ok);b.querySelector(".cand").classList.toggle("oculto",ok)});ver("pElegir")}
 catch(e){$("errC").textContent=e.message;guarda("ia-codigo","");ver("pCodigo")}finally{$("entrar").disabled=false}}
$("entrar").onclick=()=>entrar($("codigo").value);$("codigo").onkeydown=e=>{if(e.key==="Enter")entrar($("codigo").value)};
document.querySelectorAll(".ia").forEach(b=>b.onclick=()=>{if(b.classList.contains("bloq"))return;ia=b.dataset.ia;hist=[];$("msgs").innerHTML="";$("titulo").textContent=NOMBRES[ia][0];$("sub").textContent=NOMBRES[ia][1];ver("pChat");envia("Hola")});
$("volver").onclick=()=>{$("titulo").textContent="IAs del Club Desde Cero";$("sub").textContent="Sergio Suárez";ver("pElegir")};
function pinta(r,t){const d=document.createElement("div");d.className="m "+(r==="u"?"u":"ia2");if(r==="u")d.textContent=t;else d.innerHTML=marked.parse(t);$("msgs").appendChild(d);d.scrollIntoView({behavior:"smooth",block:"start"});return d}
async function envia(t){t=(t||"").trim();if(!t)return;if(hist.length)pinta("u",t);hist.push({r:"u",t});$("txt").value="";$("enviar").disabled=true;
 const p=document.createElement("div");p.className="pensando";p.textContent="Pensando tu vídeo…";$("msgs").appendChild(p);
 try{const j=await llama("chat",{ia,mensajes:hist});p.remove();hist.push({r:"m",t:j.texto});pinta("m",j.texto);$("quedan").textContent=`Hoy te quedan ${j.quedan} mensajes.`}
 catch(e){p.textContent="⚠️ "+e.message;hist.pop()}finally{$("enviar").disabled=false}}
$("enviar").onclick=()=>envia($("txt").value);$("txt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();envia($("txt").value)}};
const g=lee("ia-codigo");if(g){$("codigo").value=g;entrar(g)}
</script></body></html>
